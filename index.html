<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172b4d">
<title>產品報價單</title>
<style>
:root{--navy:#172b4d;--blue:#245b9e;--ink:#243247;--muted:#718096;--line:#e3e9f0;--bg:#f4f7fb;--white:#fff;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:linear-gradient(120deg,#172b4d,#285b8e);color:white;padding:28px 20px 34px}
.head{max-width:1080px;margin:auto}h1{font-size:clamp(24px,4vw,34px);margin:0 0 7px;letter-spacing:.04em}.sub{opacity:.82;font-size:14px}
main{max-width:1080px;margin:-16px auto 100px;padding:0 18px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 8px 28px #2432470a}
.panel h2{font-size:17px;margin:0 0 17px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:#59677a;font-weight:650}
input,select{width:100%;height:44px;border:1px solid #cfd8e3;border-radius:9px;padding:0 12px;font:inherit;background:white;color:var(--ink);min-width:0}
input:focus,select:focus{outline:3px solid #dceaff;border-color:#5489c8}
.status{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;background:#eef5ff;color:#234c7c}
.status.error{background:#fff0ef;color:var(--red)}.status.ok{background:#edf8f1;color:#17663a}
.items{display:grid;gap:12px}.item{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fcfdff}
.item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.item-title{font-weight:700;color:var(--navy)}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item-grid .wide{grid-column:1/-1}
.item-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.meta{background:#f3f6fa;border-radius:8px;padding:9px 10px;min-width:0}.meta small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.meta strong{font-size:14px;overflow-wrap:anywhere}
.item-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.line-total{font-weight:750;color:var(--navy)}
button{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
button:disabled{opacity:.42;cursor:not-allowed}.primary{background:var(--blue);color:white}.primary:hover:not(:disabled){background:#194a84}
.secondary{background:#eaf1f9;color:#234c7c}.ghost{background:transparent;color:#a43b35;padding:8px 10px}
.add{width:100%;border:1px dashed #9eb4cc;background:#f7faff;color:#245b9e;margin-top:13px}
.summary{display:flex;justify-content:flex-end}.summary-inner{width:min(100%,360px);display:grid;gap:9px}.sumrow{display:flex;justify-content:space-between;color:#5c6878}.sumrow.total{border-top:1px solid var(--line);padding-top:12px;font-size:20px;font-weight:800;color:var(--navy)}
.sticky{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px max(18px,calc((100vw - 1044px)/2));display:flex;justify-content:flex-end;gap:10px;z-index:5}
.sticky button{min-width:150px}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:12px 0 0}
#quote{display:none;position:fixed;inset:0;background:#172b4dcc;z-index:10;overflow:auto;padding:22px}
.quote-wrap{max-width:820px;margin:20px auto;background:white;padding:34px;border-radius:12px}
.quote-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--navy);padding-bottom:18px;margin-bottom:20px}
.quote-head h2{font-size:27px;margin:0;color:var(--navy)}.quote-info{font-size:13px;line-height:1.9;text-align:right}
.quote-customer{font-size:14px;line-height:1.9;margin:12px 0 22px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{background:#f0f4f8;color:#33465f}td.num,th.num{text-align:right}
.quote-total{width:min(100%,320px);margin:20px 0 0 auto}.quote-total div{display:flex;justify-content:space-between;padding:6px 0}.quote-total .grand{font-size:19px;font-weight:800;border-top:2px solid var(--navy);margin-top:6px;padding-top:12px}
.quote-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}
.empty{text-align:center;color:var(--muted);padding:24px}
@media(max-width:640px){header{padding:23px 17px 29px}main{padding:0 12px;margin-bottom:112px}.panel{padding:16px;border-radius:13px}.grid{grid-template-columns:1fr}.item{padding:12px}.item-grid{grid-template-columns:1fr}.item-grid .wide{grid-column:auto}.item-meta{grid-template-columns:repeat(3,minmax(0,1fr))}.meta{padding:8px 7px}.meta strong{font-size:12px}.sticky{padding:10px 12px}.sticky button{flex:1;min-width:0;padding:12px 8px;font-size:14px}.quote-wrap{padding:20px 14px;margin:0 auto}.quote-head{flex-direction:column}.quote-info{text-align:left}.quote-head h2{font-size:23px}table{font-size:11px}th,td{padding:8px 4px}.quote-actions{flex-wrap:wrap}.quote-actions button{flex:1}}
@media print{body{background:white}#quote{display:block!important;position:static;background:white;padding:0}.quote-wrap{box-shadow:none;margin:0;max-width:none;padding:0}.quote-actions{display:none}}
</style>
</head>
<body>
<header><div class="head"><h1>產品報價單</h1><div class="sub">即時連結產品資料・快速建立專業報價</div></div></header>
<main>
  <div id="status" class="status">正在連線讀取產品資料…</div>
  <section class="panel">
    <h2>報價基本資料</h2>
    <div class="grid">
      <div class="field"><label for="customer">客戶名稱</label><input id="customer" placeholder="請輸入客戶／公司名稱"></div>
      <div class="field"><label for="quoteDate">報價日期</label><input id="quoteDate" type="date"></div>
    </div>
  </section>
  <section class="panel">
    <h2>品項明細</h2>
    <div id="items" class="items"><div class="empty">產品資料載入後即可新增品項</div></div>
    <button id="addBtn" class="add" disabled>＋ 新增品項</button>
    <p class="hint">請先選擇類別，再選擇產品編號。數量輸入 0 時會自動移除此品項。</p>
  </section>
  <section class="panel">
    <h2>金額試算</h2>
    <div class="summary"><div class="summary-inner">
      <div class="sumrow"><span>未稅小計</span><strong id="subtotal">NT$ 0</strong></div>
      <div class="sumrow"><span>營業稅（5%）</span><strong id="tax">NT$ 0</strong></div>
      <div class="sumrow total"><span>含稅總計</span><strong id="grand">NT$ 0</strong></div>
    </div></div>
  </section>
</main>
<div class="sticky">
  <button id="addSticky" class="secondary" disabled>＋ 新增品項</button>
  <button id="makeBtn" class="primary" disabled>產生報價單</button>
</div>
<div id="quote" role="dialog" aria-modal="true" aria-label="報價單預覽">
 <div class="quote-wrap" id="quotePaper">
  <div class="quote-head"><div><h2>報 價 單</h2><div style="color:#718096;font-size:12px;margin-top:7px">QUOTATION</div></div><div class="quote-info">報價日期：<span id="qDate"></span><br>報價單號：<span id="qNo"></span></div></div>
  <div class="quote-customer">客戶名稱：<strong id="qCustomer"></strong></div>
  <table><thead><tr><th>產品編號</th><th>品名</th><th>單位</th><th class="num">數量</th><th class="num">單價</th><th class="num">小計</th></tr></thead><tbody id="qRows"></tbody></table>
  <div class="quote-total"><div><span>未稅小計</span><strong id="qSubtotal"></strong></div><div><span>營業稅（5%）</span><strong id="qTax"></strong></div><div class="grand"><span>含稅總計</span><strong id="qGrand"></strong></div></div>
  <div style="margin-top:35px;padding-top:12px;border-top:1px solid #e3e9f0;color:#718096;font-size:11px">本報價單金額以新台幣計價，營業稅依 5% 計算。</div>
  <div class="quote-actions"><button class="secondary" id="closeQuote">返回修改</button><button class="secondary" id="shareBtn">分享 PDF</button><button class="primary" id="downloadBtn">下載 PDF</button></div>
 </div>
</div>
<script>
(() => {
'use strict';
const SHEET_ID = '19FiN1yVL8cIK-zIhUirbmlnw0fquNOpiIZSq3erkoGg';
const REQUIRED = ['type','pno','pname','unit','price'];
let products = [], rows = [], quoteReady = false;
const $ = id => document.getElementById(id);
const money = n => 'NT$ ' + Math.round(Number(n)||0).toLocaleString('zh-TW');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = new Date();
$('quoteDate').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
function setStatus(message, type='') { $('status').textContent = message; $('status').className = 'status ' + type; }
function setEnabled(ok) { $('addBtn').disabled = !ok; $('addSticky').disabled = !ok; $('makeBtn').disabled = !ok; }
function loadProducts() {
  const callback = 'gvizCallback_' + Date.now();
  const script = document.createElement('script');
  let finished = false;
  const timer = setTimeout(() => fail('讀取產品資料逾時，請確認試算表已開放「知道連結的任何人可檢視」，並重新整理頁面。'), 15000);
  function cleanup(){ clearTimeout(timer); delete window[callback]; script.remove(); }
  function fail(msg){ if(finished)return; finished=true; cleanup(); setEnabled(false); setStatus(msg,'error'); }
  window[callback] = response => {
    if(finished)return;
    try {
      if (!response || response.status !== 'ok') throw new Error('Google 試算表回傳資料異常');
      const table = response.table;
      const headers = table.cols.map(c => String(c.label || c.id || '').trim().toLowerCase());
      const indexes = Object.fromEntries(REQUIRED.map(k => [k, headers.indexOf(k)]));
      const missing = REQUIRED.filter(k => indexes[k] < 0);
      if(missing.length) throw new Error('找不到必要欄位：' + missing.join('、'));
      const parsed = table.rows.map(r => {
        const v = key => { const cell = r.c[indexes[key]]; return cell ? (cell.v ?? cell.f ?? '') : ''; };
        return {type:String(v('type')).trim(),pno:String(v('pno')).trim(),pname:String(v('pname')).trim(),unit:String(v('unit')).trim(),price:Number(String(v('price')).replace(/,/g,''))};
      }).filter(p => p.type && p.pno && p.pname && Number.isFinite(p.price));
      if(!parsed.length) throw new Error('試算表沒有可用的產品資料，請檢查資料列與欄位內容。');
      products = parsed;
      finished=true; cleanup(); setEnabled(true);
      setStatus(`產品資料載入成功，共 ${products.length} 筆。每次開啟頁面都會重新讀取最新資料。`,'ok');
      renderItems();
    } catch(err) { fail(err.message || '產品資料格式錯誤'); }
  };
  script.onerror = () => fail('無法連線至 Google 試算表，請檢查網路或分享權限。');
  const tqx = encodeURIComponent(`out:json;responseHandler:${callback}`);
  script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=${tqx}&tq=${encodeURIComponent('select A,B,C,D,E')}`;
  document.head.appendChild(script);
}
function addRow(){ rows.push({id:crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),type:'',pno:'',qty:1}); renderItems(); }
function renderItems(){
 const root=$('items');
 if(!rows.length){root.innerHTML='<div class="empty">尚未新增品項，請按「新增品項」開始。</div>';updateTotals();return;}
 root.innerHTML=rows.map((r,i)=>{
   const types=[...new Set(products.map(p=>p.type))];
   const options=products.filter(p=>p.type===r.type);
   const p=options.find(x=>x.pno===r.pno);
   return `<article class="item" data-id="${esc(r.id)}">
    <div class="item-top"><span class="item-title">品項 ${i+1}</span><button class="ghost remove" type="button">移除 ×</button></div>
    <div class="item-grid">
      <div class="field"><label>產品類別</label><select class="type"><option value="">請選擇類別</option>${types.map(t=>`<option ${t===r.type?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div>
      <div class="field"><label>產品編號</label><select class="pno" ${r.type?'':'disabled'}><option value="">請選擇編號</option>${options.map(x=>`<option value="${esc(x.pno)}" ${x.pno===r.pno?'selected':''}>${esc(x.pno)}｜${esc(x.pname)}</option>`).join('')}</select></div>
      <div class="field wide"><label>數量</label><input class="qty" type="number" min="0" step="1" value="${esc(r.qty)}" inputmode="numeric"></div>
    </div>
    <div class="item-meta"><div class="meta"><small>品名</small><strong>${p?esc(p.pname):'—'}</strong></div><div class="meta"><small>單位</small><strong>${p?esc(p.unit):'—'}</strong></div><div class="meta"><small>單價</small><strong>${p?money(p.price):'—'}</strong></div></div>
    <div class="item-bottom"><span class="hint" style="margin:0">品項小計</span><strong class="line-total">${p?money(p.price*(Number(r.qty)||0)):'NT$ 0'}</strong></div>
   </article>`;
 }).join('');
 root.querySelectorAll('.item').forEach(card=>{
   const id=card.dataset.id, row=rows.find(x=>x.id===id);
   card.querySelector('.type').addEventListener('change',e=>{row.type=e.target.value;row.pno='';renderItems();});
   card.querySelector('.pno').addEventListener('change',e=>{row.pno=e.target.value;renderItems();});
   card.querySelector('.qty').addEventListener('change',e=>{const q=Math.max(0,Number(e.target.value)||0);if(q===0){rows=rows.filter(x=>x.id!==id);}else row.qty=q;renderItems();});
   card.querySelector('.remove').addEventListener('click',()=>{rows=rows.filter(x=>x.id!==id);renderItems();});
 });
 updateTotals();
}
function totals(){let subtotal=0;rows.forEach(r=>{const p=products.find(x=>x.type===r.type&&x.pno===r.pno);if(p)subtotal+=p.price*r.qty;});const tax=Math.round(subtotal*0.05);return{subtotal,tax,grand:subtotal+tax};}
function updateTotals(){const t=totals();$('subtotal').textContent=money(t.subtotal);$('tax').textContent=money(t.tax);$('grand').textContent=money(t.grand);}
function makeQuote(){
 const customer=$('customer').value.trim();
 const date=$('quoteDate').value;
 const chosen=rows.map(r=>({...r,product:products.find(p=>p.type===r.type&&p.pno===r.pno)})).filter(r=>r.product&&r.qty>0);
 if(!customer){alert('請先填寫客戶名稱。');$('customer').focus();return;}
 if(!date){alert('請選擇報價日期。');return;}
 if(!chosen.length){alert('請至少新增一筆完整品項並輸入數量。');return;}
 const t=totals();
 $('qCustomer').textContent=customer;$('qDate').textContent=date;$('qNo').textContent='QT'+date.replaceAll('-','')+'-'+String(Date.now()).slice(-4);
 $('qRows').innerHTML=chosen.map(r=>`<tr><td>${esc(r.product.pno)}</td><td>${esc(r.product.pname)}</td><td>${esc(r.product.unit)}</td><td class="num">${r.qty.toLocaleString('zh-TW')}</td><td class="num">${money(r.product.price)}</td><td class="num">${money(r.product.price*r.qty)}</td></tr>`).join('');
 $('qSubtotal').textContent=money(t.subtotal);$('qTax').textContent=money(t.tax);$('qGrand').textContent=money(t.grand);
 $('quote').style.display='block';quoteReady=true;
}
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').slice(0,50)||'客戶';}
let pdfLibrariesPromise = null;
function ensurePdfLibraries(){
 if(window.html2canvas && window.jspdf) return Promise.resolve();
 if(pdfLibrariesPromise) return pdfLibrariesPromise;
 const load = (src, ready) => new Promise((resolve,reject)=>{
   if(ready()) return resolve();
   const script=document.createElement('script');
   script.src=src;
   script.onload=()=>ready()?resolve():reject(new Error('PDF 元件載入後無法使用。'));
   script.onerror=()=>reject(new Error('PDF 元件下載失敗，請確認網路連線後重試。'));
   document.head.appendChild(script);
 });
 pdfLibrariesPromise=(async()=>{
   await load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>!!window.html2canvas);
   await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>!!window.jspdf);
 })().catch(err=>{pdfLibrariesPromise=null;throw err;});
 return pdfLibrariesPromise;
}
async function buildPdf(){
 await ensurePdfLibraries();
 const paper=$('quotePaper');
 const actions=paper.querySelector('.quote-actions');
 const oldDisplay=actions.style.display;
 actions.style.display='none';
 let canvas;
 try{
   canvas=await window.html2canvas(paper,{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:paper.scrollWidth,windowHeight:paper.scrollHeight,scrollX:0,scrollY:0});
 }finally{actions.style.display=oldDisplay;}
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});
 const pageW=210,pageH=297,margin=10;
 const printableW=pageW-margin*2, printableH=pageH-margin*2;
 const pxPerMm=canvas.width/printableW;
 const sliceHeight=Math.max(1,Math.floor(printableH*pxPerMm));
 let page=0;
 for(let offsetY=0;offsetY<canvas.height;offsetY+=sliceHeight){
   const h=Math.min(sliceHeight,canvas.height-offsetY);
   const pageCanvas=document.createElement('canvas');
   pageCanvas.width=canvas.width;pageCanvas.height=h;
   const ctx=pageCanvas.getContext('2d');
   ctx.fillStyle='#ffffff';ctx.fillRect(0,0,pageCanvas.width,pageCanvas.height);
   ctx.drawImage(canvas,0,offsetY,canvas.width,h,0,0,canvas.width,h);
   if(page>0)pdf.addPage();
   pdf.addImage(pageCanvas.toDataURL('image/jpeg',0.96),'JPEG',margin,margin,printableW,h/pxPerMm,undefined,'FAST');
   page++;
 }
 const date=$('quoteDate').value;
 const filename=`報價單_${safeName($('customer').value.trim())}_${date}.pdf`;
 return {pdf,blob:pdf.output('blob'),filename};
}
function saveBlob(blob,filename){
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function downloadPdf(){
 const btn=$('downloadBtn'),old=btn.textContent;
 btn.disabled=true;btn.textContent='正在產生 PDF…';
 try{
   const result=await buildPdf();
   try{result.pdf.save(result.filename);}catch(_){saveBlob(result.blob,result.filename);}
 }catch(err){alert(err.message||'PDF 產生失敗，請稍後再試。');}
 finally{btn.disabled=false;btn.textContent=old;}
}
async function sharePdf(){
 const btn=$('shareBtn'),old=btn.textContent;
 btn.disabled=true;btn.textContent='正在準備分享…';
 try{
   const result=await buildPdf();
   const file=new File([result.blob],result.filename,{type:'application/pdf'});
   if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
     await navigator.share({files:[file],title:'產品報價單',text:'報價單 PDF'});
   }else{
     saveBlob(result.blob,result.filename);
     alert('此裝置不支援直接分享檔案，已改為下載 PDF。下載後可從檔案選單分享至 LINE 或 Email。');
   }
 }catch(err){if(err.name!=='AbortError')alert(err.message||'分享失敗，請改用「下載 PDF」。');}
 finally{btn.disabled=false;btn.textContent=old;}
}
$('addBtn').addEventListener('click',addRow);$('addSticky').addEventListener('click',addRow);
$('makeBtn').addEventListener('click',makeQuote);
$('closeQuote').addEventListener('click',()=>$('quote').style.display='none');
$('shareBtn').addEventListener('click',sharePdf);
$('downloadBtn').addEventListener('click',downloadPdf);
loadProducts();
})();
</script>
</body></html>
